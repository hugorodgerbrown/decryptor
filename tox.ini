# tox is the entrypoint for tests and linting; CI and local runs go through it.
# Environments are built by uv from uv.lock, so tox installs exactly the pinned
# set rather than re-resolving.
[tox]
env_list = lint, py312, py313, py314
requires =
    tox>=4.60
    tox-uv>=1.36

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    test
    build
# A cold checkout has no .vocab-cache.pkl (it is gitignored), so vocab.load()
# rebuilds it from wordnet. The cache lands at the repo root and every later
# environment reuses it, so this only costs anything on the first run.
commands_pre = python -c "import nltk; nltk.download('wordnet', quiet=True)"
commands = pytest {posargs}

[testenv:lint]
runner = uv-venv-lock-runner
dependency_groups = lint
# No corpus needed to lint.
commands_pre =
commands = ruff check {posargs:.}
